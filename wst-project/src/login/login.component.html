<div class="login-page">
  <div class="login-card">
    <div class="seal-container">
      <div class="official-seal">🏛️</div>
    </div>

    <header class="login-header">
      <h1>Malacañang Archive</h1>
      <p class="tagline">Digital Repository of the Philippine Presidency</p>
    </header>

<form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
  
  <div class="input-group">
    <label for="email">INSTITUTIONAL EMAIL</label>
    <div class="input-wrapper">
      <span class="prefix">@</span>
      <input 
        id="email"
        type="email" 
        name="email"
        formControlName="email" 
        placeholder="name@institution.gov.ph">
    </div>
  </div>

  <div class="input-group">
    <div class="label-row">
      <label for="password">ACCESS KEY</label>
      <a href="#" class="forgot-link">Forgot Access?</a>
    </div>
    <div class="input-wrapper">
      <span class="prefix">🔒</span>
      <input 
        id="password"
        type="password" 
        name="password"
        formControlName="password" 
        placeholder="••••••••">
    </div>
  </div>

  <button type="submit" class="btn-access" [disabled]="loginForm.invalid">
    Access Archive 🔓
  </button>

  <div class="auth-footer">
    <p>First time here? 
      <a routerLink="/register" class="register-link">Request Enrollment</a>
    </p>
  </div>
</form>

    <footer class="login-footer">
      <p class="warning-text">
        RESTRICTED GOVERNMENT SYSTEM. Unauthorized access is subject to Republic Act No. 8293 and the Data Privacy Act of 2012.
      </p>
      <div class="footer-links">
        <a href="#">Technical Support</a>
        <a href="#">Data Privacy</a>
      </div>
    </footer>
  </div>
</div>
