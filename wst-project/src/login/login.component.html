<div class="login-screen">
  <div class="login-card">
    
    <div class="logo-container">
      <div class="logo-circle">
        <span class="pillar">IIII</span>
      </div>
    </div>

    <header class="card-header">
      <h1>Malacañang Archive</h1>
      <p class="tagline">Preserving the National Identity of the Filipino People</p>
    </header>

    <form class="login-form">
      <div class="form-group">
        <div class="label-row">
          <label>EMAIL</label>
          <span class="shield-icon">🛡️</span>
        </div>
        <div class="input-wrapper">
          <span class="prefix">@</span>
          <input type="text" name="username" [(ngModel)]="username" placeholder="name@institution.gov.ph">
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>PASSWORD</label>
          <a href="#" class="forgot-link">Forgot Access?</a>
        </div>
        <div class="input-wrapper">
          <span class="prefix">🔒</span>
          <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••">
        </div>
      </div>

      <p class="error-text" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="button" class="submit-btn" (click)="onLogin()">
        Access Archive <span class="unlock-icon">🔓</span>
      </button>
    </form>

    <footer class="card-footer">
      <div class="divider"></div>
      <p class="restriction-notice">This is a restricted government system.</p>
      <p class="law-notice">Unauthorized access is subject to Republic Act No. 8293.</p>
      
      <div class="support-links">
        <a href="#"><span class="info-icon">ⓘ</span> Technical Support</a>
        <a href="#"><span class="info-icon">🛡️</span> Data Privacy</a>
      </div>
    </footer>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <span class="dot"></span> SYSTEM ONLINE
    </div>
    <div class="status-right">
      V4.2.1-ARCHIVE
    </div>
  </div>
</div>
