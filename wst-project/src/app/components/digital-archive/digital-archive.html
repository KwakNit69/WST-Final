<div class="card-container">
  <div class="profile-header">
    <div class="status-indicator" [ngClass]="user.status"></div>
    <img src="https://via.placeholder.com/100" alt="Profile Picture" class="profile-img">
  </div>

  <div class="profile-content">
    <h2>{{ user.name }}</h2>
    <p class="role">{{ user.role }}</p>
    <p class="bio">{{ user.bio }}</p>

    <div class="skills-tags">
      <span *ngFor="let skill of user.skills" class="tag">{{ skill }}</span>
    </div>
  </div>

  <div class="profile-footer">
    <button (click)="toggleFollow()" [class.following]="isFollowing">
      {{ isFollowing ? 'Unfollow' : 'Follow' }}
    </button>
  </div>
</div>
