<div class="archive-container">
  <div class="archive-header">
    <p class="tagline">NATIONAL REPOSITORY</p>
    <h1>The Digital Archive</h1>
  </div>

  <div class="document-grid">
    <div *ngFor="let item of collections" class="archive-card">
      <div class="folder-header">
        <span class="year">{{ item.year }}</span>
        <span class="status-badge">{{ item.status }}</span>
      </div>
      
      <div class="folder-body">
        <h3>{{ item.title }}</h3>
        <p class="president-sub">{{ item.president }}</p>
        <ul class="doc-list">
          <li *ngFor="let doc of item.docs">📄 {{ doc }}</li>
        </ul>
      </div>
      
      <button class="access-btn">ACCESS RECORDS</button>
    </div>
  </div>
</div>
