<div class="main-container">
  <main class="hero-content">
    <div class="content-text">
      <p class="tagline">PRESERVING THE NATIONAL LEGACY</p>
      <h1>The Malacañang Archive</h1>
      
      <div class="stats-container">
        <div class="stat-item" *ngIf="stats.total > 0; else loading">
          <span class="stat-label">National Population</span>
          <span class="stat-value">{{ stats.total | number }}</span>
        </div>
        <div class="stat-item" *ngIf="stats.voters > 0">
          <span class="stat-label">Eligible Voters (Est.)</span>
          <span class="stat-value">{{ stats.voters | number }}</span>
        </div>
        
        <ng-template #loading>
          <span class="loading-text">Retrieving National Records...</span>
        </ng-template>
      </div>

      <p class="description">
        A curated digital repository chronicling the heritage of the Philippine Presidency...
      </p>
    </div>

    <div class="hero-buttons">
      <a routerLink="/list" class="btn btn-primary">EXPLORE THE COLLECTIONS</a>
      <button class="btn btn-secondary">VIEW TIMELINE</button>
    </div>
  </main>
</div>
