<div class="dashboard-wrapper">

  <header class="dashboard-header">
    <span class="gold-accent-line"></span>
    <h1>The Presidents <br> of the Philippines</h1>
    <p class="subtitle">
      Explore the legacies of the leaders who shaped the Republic, from the revolutionary days of 1899 to the present.
    </p>
  </header>

  <section class="controls-bar">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search by name, era, or party...">
    </div>

  </section>

  <main class="portrait-grid">
    <div 
      *ngFor="let president of presidents" 
      class="portrait-card" 
      [routerLink]="['/biography', president.id]">
      
      <div class="image-wrapper">
        <img [src]="'/' + president.image" [alt]="president.name" class="portrait-image">
        <div class="hover-overlay">
          <span>VIEW BIOGRAPHY →</span>
        </div>
      </div>
      
      <div class="card-details">
        <span class="era-tag">{{ president.era }}</span>
        <h2 class="president-name">{{ president.name }}</h2>
        <p class="service-years">{{ president.years }}</p>
        <span class="republic-detail">{{ president.republic }}</span>
      </div>
    </div>
  </main>
</div>
